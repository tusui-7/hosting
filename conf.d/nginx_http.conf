
user  nobody;
worker_processes  2;

error_log  HOME/BIN_PATH/nginx/logs/error.log notice;
pid        HOME/BIN_PATH/nginx/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       "HOME/BIN_PATH/nginx/conf/mime.types";
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  HOME/BIN_PATH/nginx/logs/access.log  main;

    sendfile        on;
    client_max_body_size 1024M;
    keepalive_timeout  65;

    include HOME/BIN_PATH/nginx/conf/conf.d/*.conf;
    
}
